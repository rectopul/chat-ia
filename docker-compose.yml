services:
  # ─── PostgreSQL (Banco de Dados) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: telebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teletram-bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - telebot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teletram-bot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ─── Redis (Fila de Processamento BullMQ) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: telebot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - telebot-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS Backend (API e Lógica do Bot) ─────────────────────────────────
  nest:
    build:
      context: .
      dockerfile: telegram-user-service-nest/Dockerfile
    container_name: telebot-nest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/teletram-bot?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CRON_SECRET: efde69757d24768319e945157dc0f298181ed884f9af551013939f5352e79847
      SYNCPAY_CLIENT_ID: 120555ca-053a-4cbb-bda5-fb27e372716f
      SYNCPAY_CLIENT_SECRET: 9e0885ac-c04d-4cdb-8002-d37d189d49b8
      SYNCPAY_DEFAULT_CPF: "27688457874"
      SYNCPAY_DEFAULT_EMAIL: clientes@botelecontents.com
      SYNCPAY_DEFAULT_PHONE: "21995812705"
      SYNCPAY_WEBHOOK_URL: http://109.205.183.50:3001/webhook/syncpay
      PORT: 3001
    ports:
      - "3001:3001"
    networks:
      - telebot-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Next.js Frontend (Painel de Controle) ───────────────────────────────
  next:
    build:
      context: .
      dockerfile: Dockerfile.next
    container_name: telebot-next
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nest:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/teletram-bot?schema=public
      NEXTAUTH_SECRET: efde69757d24768319e945157dc0f298181ed884f9af551013939f5352e79847
      AUTH_TRUST_HOST: "true"
      NEXTAUTH_URL: http://109.205.183.50:3000
      TELEGRAM_BOT_TOKEN: 8571873164:AAFRXaolzTRGxZRQ9icrZB5bFIcyfIrhhOk
      TELEGRAM_WEBHOOK_SECRET: efde69757d24768319e945157dc0f298181ed884f9af551013939f5352e79847
      CRON_SECRET: efde69757d24768319e945157dc0f298181ed884f9af551013939f5352e79847
      APP_BASE_URL: http://109.205.183.50:3000
      BLOB_READ_WRITE_TOKEN: vercel_blob_rw_24EOt89DvmKbxT6P_3GZ44f7MD5p2rj11ZHA6L4zZcSI93S
      NEXT_PUBLIC_NEST_API_URL: http://109.205.183.50:3001
      NEST_API_URL: http://nest:3001
      SYNCPAY_API_URL: https://api.syncpay.com.br
    ports:
      - "3000:3000"
    networks:
      - telebot-network

networks:
  telebot-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: