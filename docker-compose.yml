services:
  # ─── PostgreSQL (Banco de Dados) ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: telebot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres          # Usuário mestre do banco de dados
      POSTGRES_PASSWORD: postgres      # Senha do banco de dados (recomenda-se alterar em produção)
      POSTGRES_DB: teletram-bot        # Nome do banco de dados inicial
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (Fila de Processamento BullMQ) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: telebot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # Garante que as tarefas não se percam ao reiniciar
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS Backend (API e Lógica do Bot) ─────────────────────────────────
  nest:
    build:
      context: .
      dockerfile: telegram-user-service-nest/Dockerfile
    container_name: telebot-nest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/teletram-bot?schema=public # Link de conexão interna com o banco
      REDIS_HOST: redis                # Endereço interno do serviço Redis
      REDIS_PORT: 6379                 # Porta interna do Redis
      CRON_SECRET: efde6975...         # Token de segurança para disparar tarefas agendadas
      SYNCPAY_CLIENT_ID: 120555ca...   # ID do cliente na plataforma SyncPay (Pagamentos)
      SYNCPAY_CLIENT_SECRET: 9e0885ac..# Chave secreta da SyncPay
      SYNCPAY_DEFAULT_CPF: "2768845..."# CPF padrão usado em testes de checkout
      SYNCPAY_DEFAULT_EMAIL: cli@...   # E-mail padrão para notificações de venda
      SYNCPAY_DEFAULT_PHONE: "21995..."# Telefone padrão para notificações
      SYNCPAY_WEBHOOK_URL: https://... # URL que recebe confirmação de pagamento da SyncPay
      PORT: 3001                       # Porta onde o servidor Backend roda internamente
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── Next.js Frontend (Painel de Controle) ───────────────────────────────
  next:
    build:
      context: .
      dockerfile: Dockerfile.next
    container_name: telebot-next
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      nest:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://...   # Conexão direta do painel com o banco (para Auth e dados)
      NEXTAUTH_SECRET: efde6975...     # Chave de criptografia para as sessões de login do painel
      AUTH_TRUST_HOST: "true"          # Permite que o sistema de login funcione atrás de um Proxy/VPS
      NEXTAUTH_URL: "http://localhost:3000" # URL base para o sistema de autenticação
      TELEGRAM_BOT_TOKEN: 857187...    # Token oficial do bot principal (gerado no BotFather)
      TELEGRAM_WEBHOOK_SECRET: efde69..# Senha de segurança para validar mensagens do Telegram
      CRON_SECRET: efde6975...         # Deve ser igual à do Backend para autorizar tarefas
      APP_BASE_URL: https://...        # URL pública onde o painel Next.js está acessível
      BLOB_READ_WRITE_TOKEN: vercel_.. # Token para armazenamento de imagens/vídeos (Vercel Blob)
      NEXT_PUBLIC_NEST_API_URL: http://109.205.183.50:3001 # URL do Backend para o Navegador do Cliente
      SYNCPAY_API_URL: ""              # (Opcional) URL customizada da API SyncPay
      NEST_API_URL: http://109.205.183.50:3001 # URL do Backend para comunicação interna do servidor
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data: